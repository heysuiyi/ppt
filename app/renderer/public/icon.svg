<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Agent PPT app icon</title>
  <desc id="desc">A folded-paper letter A mark in vivid purple-to-magenta and amber gradients, with a slide-bar crossbar.</desc>
  <defs>
    <linearGradient id="front" x1="120" y1="120" x2="540" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="fold" x1="480" y1="80" x2="920" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="0.42" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="flap" x1="430" y1="60" x2="620" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="bar" x1="250" y1="540" x2="760" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.45" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Left paper face: thicker, slightly bowed outer edge, bias-cut foot -->
  <path
    fill="url(#front)"
    d="M498 198
       C470 198 448 208 430 228
       L128 778
       C116 800 128 828 154 836
       L318 872
       C342 878 364 862 370 838
       L428 560
       L468 318
       L498 236
       Z"
  />

  <!-- Right paper face: warmer fold side, slightly wider and offset -->
  <path
    fill="url(#fold)"
    d="M526 198
       C554 198 576 210 592 232
       L904 760
       C918 784 904 816 876 824
       L702 868
       C678 874 658 858 654 834
       L598 560
       L560 320
       L526 236
       Z"
  />

  <!-- Large dog-ear peak fold — the memorable irregular tip -->
  <path
    fill="url(#flap)"
    d="M430 228
       L512 188
       L592 232
       L560 96
       C548 72 476 72 464 96
       Z"
  />
  <!-- Underside of the folded tip (shows the fold plane) -->
  <path
    fill="url(#front)"
    d="M430 228
       L512 188
       L498 198
       L464 150
       Z"
  />
  <path
    fill="url(#fold)"
    d="M512 188
       L592 232
       L560 150
       L526 198
       Z"
  />

  <!-- Slide-bar crossbar as a soft paper strip sitting across the fold -->
  <path
    fill="url(#bar)"
    d="M286 548
       C274 548 266 560 270 572
       L292 648
       C296 662 310 670 324 666
       L730 582
       C744 580 752 566 746 552
       L726 490
       C722 476 706 470 692 476
       Z"
  />
</svg>
