name: Agent Harness Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-24.04
    env:
      # Unit tests never launch Electron; skip the binary download in CI.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  windows-test:
    name: Unit tests (Windows)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Unit tests
        run: npm.cmd test

  package-desktop:
    name: Package desktop (${{ matrix.name }})
    needs:
      - check
      - windows-test
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
            artifact_name: agent-harness-desktop-win

          - name: macOS
            os: macos-latest
            target: mac
            artifact_name: agent-harness-desktop-mac

          - name: Linux
            os: ubuntu-24.04
            target: linux
            artifact_name: agent-harness-desktop-linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify icon assets
        shell: bash
        run: |
          test -f build/icon.svg
          test -f build/icon.ico
          test -f build/icon.png
          test -f build/icon.icns
          cmp build/icon.svg app/renderer/public/icon.svg
          cmp build/icon.png app/renderer/public/icon.png

      - name: Build app
        run: npm run build

      - name: Package app
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  package-cli:
    name: Package CLI
    needs:
      - check
      - windows-test
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package and smoke-test standalone CLI
        run: npm run package:cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-harness-cli
          path: dist/cli/agent-harness-cli-*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - package-desktop
      - package-cli
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-artifacts

      - name: Resolve release target
        id: release_target
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            {
              echo "tag=${GITHUB_REF_NAME}"
              echo "title=Agent Harness ${GITHUB_REF_NAME}"
              echo "prerelease=false"
              echo "rolling=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=latest"
              echo "title=Agent Harness — Latest Build"
              echo "prerelease=true"
              echo "rolling=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check release files
        shell: bash
        run: |
          echo "Release files:"
          find release-artifacts -type f

      - name: Move rolling release tag
        if: steps.release_target.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_target.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release_target.outputs.prerelease }}
        shell: bash
        run: |
          mapfile -t files < <(find release-artifacts -type f)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TITLE" \
                --notes "Rolling build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." \
                --prerelease \
                --repo "$GITHUB_REPOSITORY"
            fi
          elif [ "$RELEASE_PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "$RELEASE_TITLE" \
              --notes "Rolling build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
